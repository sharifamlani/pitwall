name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ubuntu:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run compile
      - run: node scripts/build-manifest.mjs --check
      - run: npm test

  windows:
    # Windows runs the build only. The test suite joins in Phase 2 (Windows parity).
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run compile
      - run: node scripts/build-manifest.mjs --check

  privacy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - run: python -m tools.check_private_paths
      - run: pip install -q pytest python-dotenv && python -m pytest -q tools/tests
      - name: gitleaks (full history)
        # The runner uid owns the checkout, so git inside the container does not refuse it as "dubious ownership".
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 git /repo --no-banner --gitleaks-ignore-path /repo/.gitleaksignore 2>&1 | tee gitleaks.log
      - name: gitleaks scanned every commit
        run: |
          scanned=$(grep -Eo '[0-9]+ commits scanned' gitleaks.log | grep -Eo '^[0-9]+' | tail -n1)
          total=$(git rev-list --count HEAD)
          echo "scanned=${scanned:-none} total=$total"
          [ -n "$scanned" ] && [ "$scanned" -ge "$total" ]
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm ci
      - run: python -m tools.check_vsix
